name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx nx run disk-cleanup:typecheck
      - run: npx nx run disk-cleanup:test
